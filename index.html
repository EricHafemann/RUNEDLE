<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#010a13">
  <title>Runedle — adivinhe o campeão</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><path d='M32 4 58 32 32 60 6 32Z' fill='%23091428' stroke='%23c8aa6e' stroke-width='4'/><path d='M32 18 46 32 32 46 18 32Z' fill='%230ac8b9'/></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="rune-bg" aria-hidden="true"></div>

  <header class="topbar">
    <div class="topbar-row">
      <a href="#" class="logo" aria-label="Início">
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <path d="M32 4 58 32 32 60 6 32Z" fill="#091428" stroke="#c8aa6e" stroke-width="3"/>
          <path d="M32 16 48 32 32 48 16 32Z" fill="none" stroke="#0ac8b9" stroke-width="2.5"/>
          <circle cx="32" cy="32" r="5" fill="#0ac8b9"/>
        </svg>
        <span>RUNEDLE</span>
      </a>
      <button class="streak-badge" id="streak-badge" aria-label="Sequência diária"></button>
      <a href="#" class="icon-btn" id="btn-home" aria-label="Menu principal" hidden></a>
      <button class="icon-btn" id="btn-history" aria-label="Histórico"></button>
      <button class="icon-btn" id="btn-stats" aria-label="Estatísticas"></button>
      <button class="icon-btn" id="btn-help" aria-label="Como jogar"></button>
    </div>
    <nav class="mode-tabs" id="mode-tabs" aria-label="Modos" hidden></nav>
  </header>

  <main id="app"></main>

  <footer class="footer">
    Jogo de fãs inspirado no LoLdle. Imagens e dados de campeões: Data Dragon (patch <span id="patch">…</span>).<br>
    Runedle não é endossado pela Riot Games. League of Legends é marca registrada da Riot Games, Inc.
  </footer>

  <div id="modal-root"></div>

  <script src="js/data.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
