<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#010a13">
  <meta name="description" content="Runedle: descubra o campeão de League of Legends do dia em cinco modos, jogue no modo infinito ou desafie um amigo no X1.">
  <title>Runedle — adivinhe o campeão</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><path d='M32 4 58 32 32 60 6 32Z' fill='%23091428' stroke='%23c8aa6e' stroke-width='4'/><path d='M32 18 46 32 32 46 18 32Z' fill='%230ac8b9'/></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="client">
    <!-- ===== Coluna principal ===== -->
    <div class="main-col">
      <header class="topbar">
        <div class="play-cluster">
          <a href="#classic" class="emblem" aria-label="Runedle — desafio de hoje">
            <svg viewBox="0 0 64 64" aria-hidden="true"><path d="M32 6 56 32 32 58 8 32Z" fill="none" stroke="#c8aa6e" stroke-width="3.5"/><path d="M32 18 46 32 32 46 18 32Z" fill="#0ac8b9"/></svg>
          </a>
          <a href="#classic" class="play-btn">JOGAR</a>
        </div>
        <button class="help-dot" id="btn-help" type="button" aria-label="Como jogar">?</button>
        <nav class="top-tabs" id="top-tabs" aria-label="Seções"></nav>
        <div class="tools">
          <button class="tool" id="btn-stats" type="button" aria-label="Estatísticas" title="Estatísticas"></button>
          <button class="tool" id="btn-history" type="button" aria-label="Histórico" title="Histórico"></button>
          <a class="tool" id="btn-cal" href="#calendario" aria-label="Calendário" title="Calendário"></a>
        </div>
        <div class="wallet" id="wallet" aria-label="Seu progresso"></div>
      </header>

      <div class="body-row">
        <aside class="side-nav" aria-label="Desafio de hoje">
          <div class="side-banner" id="side-banner"></div>
          <nav class="side-modes" id="side-modes" aria-label="Modos do dia"></nav>
          <a class="side-foot" href="https://github.com/EricHafemann/RUNEDLE/blob/main/CHANGELOG.md" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 22 12 12 22 2 12Z" fill="none" stroke="#c8aa6e" stroke-width="2"/></svg>
            NOTAS DA VERSÃO
          </a>
        </aside>

        <section class="stage">
          <div class="stage-bg" aria-hidden="true"><img id="stage-bg-img" alt=""></div>
          <main id="app"></main>
          <footer class="footer">
            Jogo de fãs inspirado no LoLdle. Imagens e dados: Data Dragon (patch <span id="patch">…</span>) e CommunityDragon.<br>
            Runedle foi criado de acordo com a política “Legal Jibber Jabber” da Riot Games, usando materiais que pertencem à Riot Games. A Riot Games não endossa nem patrocina este projeto.
          </footer>
        </section>
      </div>
    </div>

    <!-- ===== Coluna social ===== -->
    <aside class="social" id="social" aria-label="Perfil e social"></aside>
  </div>

  <div id="modal-root"></div>

  <script src="js/data.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/x1.js"></script>
</body>
</html>
